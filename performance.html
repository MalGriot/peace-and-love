<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Performance — Mal Griot</title>
<meta name="description" content="Live sets, festivals and stage work by Mal Griot.">
<link rel="icon" href="img/brand/favicon.ico">
<link rel="apple-touch-icon" href="img/brand/apple-touch-icon.png">
<link rel="stylesheet" href="shared.css">
<link rel="stylesheet" href="morph-slider.css">
</head>
<body>

<div id="chrome-nav"></div>

<section
  id="performance-slider"
  class="morph-slider"
  data-videos="P-0kFEFUkMA,V2dxKJ0fnmY,NZ_BU9QcTHM"
  data-transition="melt"
  data-duration="1.1"
  data-intensity="0.55"
  data-scale="2.4"
  data-aberration="0.35"
  data-drift="0.4"
  data-loop="true"
  data-overlay-color="#000000"
>
  <div class="morph-slider-stage" tabindex="0" role="group" aria-roledescription="carousel" aria-label="Performance videos"></div>
  <div class="morph-slider-videos"></div>

  <div class="morph-slider-controls">
    <button type="button" class="morph-slider-btn" data-action="prev" aria-label="Previous video">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
        <path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <button type="button" class="morph-slider-btn" data-action="next" aria-label="Next video">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
        <path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </div>

  <div class="morph-slider-indicators" role="tablist" aria-label="Videos"></div>

  <button type="button" class="morph-slider-unmute">Unmute</button>
</section>

<div id="chrome-chat"></div>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script src="vendor/ogl.js"></script>
<script src="morph-slider.js"></script>
<script src="https://www.youtube.com/iframe_api"></script>
<script src="shared.js"></script>
<script src="chat.js"></script>
<script>renderChrome('performance');</script>
</body>
</html>
