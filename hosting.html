<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hosting — Mal Griot</title>
<meta name="description" content="MC and hosting work for events, brand activations and shows by Mal Griot.">
<link rel="icon" href="img/brand/favicon.ico">
<link rel="apple-touch-icon" href="img/brand/apple-touch-icon.png">
<link rel="stylesheet" href="shared.css">
<link rel="stylesheet" href="morph-slider.css?v=4">
<style>
#static-intro {
  position: fixed;
  inset: 0;
  z-index: 20;
  background: #000;
  transition: opacity 2s ease;
}
#static-intro video {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
#static-intro.static-intro--out {
  opacity: 0;
  pointer-events: none;
}

.morph-slider-controls,
.morph-slider-cta,
.morph-slider-indicators,
.morph-slider-unmute {
  z-index: 50;
}

#chrome-nav,
#chrome-chat,
.morph-slider-controls,
.morph-slider-cta,
.morph-slider-indicators,
.morph-slider-unmute {
  opacity: 0;
  transition: opacity 1.8s ease;
}
body.ui-in #chrome-nav,
body.ui-in #chrome-chat,
body.ui-in .morph-slider-controls,
body.ui-in .morph-slider-cta,
body.ui-in .morph-slider-indicators,
body.ui-in .morph-slider-unmute {
  opacity: 1;
}
</style>
</head>
<body>

<div id="chrome-nav"></div>

<div id="static-intro" aria-hidden="true">
  <video id="static-intro-video" src="video/static-intro.mp4" autoplay muted playsinline></video>
</div>

<section
  id="hosting-slider"
  class="morph-slider"
  data-videos="video/hosting-reel/dsc-9634-desktop.mp4,video/hosting-reel/sofar-6.mp4,video/hosting-reel/deep-dawn.mp4,"
  data-videos-mobile="video/hosting-reel/dsc-9634-mobile.mp4"
  data-posters="video/hosting-reel/dsc-9634-desktop-poster.jpg,video/hosting-reel/sofar-6-poster.jpg,video/hosting-reel/deep-dawn-poster.jpg,video/hosting-reel/dsc-9634-outro.jpg"
  data-posters-mobile="video/hosting-reel/dsc-9634-mobile-poster.jpg"
  data-object-positions="23% 42%,40% 35%,58% 42%,51% 40%"
  data-object-positions-mobile="44% 40%"
  data-position-keyframes="0:23% 42%,10:47% 42%,20:37% 42%,30:27% 37%,40:68% 53%,50:55% 42%,60:50% 42%|||"
  data-transition="melt"
  data-duration="1.1"
  data-intensity="0.55"
  data-scale="2.4"
  data-aberration="0.35"
  data-drift="0.4"
  data-loop="true"
  data-overlay-color="#000000"
>
  <div class="morph-slider-stage" tabindex="0" role="group" aria-roledescription="carousel" aria-label="Hosting reel"></div>
  <div class="morph-slider-videos"></div>

  <div class="morph-slider-controls">
    <button type="button" class="morph-slider-btn" data-action="prev" aria-label="Previous clip">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
        <path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <button type="button" class="morph-slider-btn" data-action="next" aria-label="Next clip">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
        <path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </div>

  <div class="morph-slider-scrim"></div>

  <div class="morph-slider-cta">
    <h2 id="hosting-cta-headline">Need a host who can actually perform?</h2>
    <p>MC, performer, poet, storyteller, and crowd facilitator — bringing presence, personality, and energy to your event.</p>
    <a href="contact.html" class="btn morph-slider-cta__btn">
      <img src="img/brand/nav-mark-gold.png" alt="" class="morph-slider-cta__mark">
      <span class="morph-slider-cta__label">Book Mal to Host Your</span>
      <span class="morph-slider-cta__word-slot"><span class="morph-slider-cta__word" id="hosting-cta-word">Event</span></span>
      <span class="morph-slider-cta__arrow" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="16" height="16"><path d="M5 12h14M13 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
    </a>
  </div>

  <div class="morph-slider-indicators" role="tablist" aria-label="Clips"></div>

  <button type="button" class="morph-slider-unmute">Unmute</button>
</section>

<div id="chrome-chat"></div>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script src="vendor/ogl.js"></script>
<script src="morph-slider.js?v=7"></script>
<script src="shared.js"></script>
<script src="chat.js"></script>
<script>renderChrome('hosting');</script>
<script>
(function () {
  var intro = document.getElementById('static-intro');
  var video = document.getElementById('static-intro-video');
  if (!intro || !video) return;
  document.body.classList.add('ui-in');

  var done = false;
  function fadeOut() {
    if (done) return;
    done = true;
    intro.classList.add('static-intro--out');
    setTimeout(function () { intro.remove(); }, 2000);
  }

  setTimeout(fadeOut, 1000);
})();
</script>
<script>
// CTA copy: headline tracks the reel's current slide (see morph-slider.js's
// 'slide-change' event); the button's last word cycles independently on a
// fixed 1s timer so it keeps moving even while the reel sits still.
(function () {
  var slider = document.getElementById('hosting-slider');
  var headline = document.getElementById('hosting-cta-headline');
  var wordEl = document.getElementById('hosting-cta-word');
  if (!slider || !headline || !wordEl) return;

  var HEADLINES = [
    'Need a host who can actually perform?',
    'Hire a host who can bring everyone together',
    'Ready to hand over the mic?',
    'Go with a host that does the most'
  ];

  slider.addEventListener('slide-change', function (e) {
    headline.textContent = HEADLINES[Math.min(e.detail.index, HEADLINES.length - 1)];
  });

  var WORDS = [
    'Event', 'Wedding', 'Festival', 'Concert', 'Conference', 'Gala',
    'Launch', 'Summit', 'Panel', 'Workshop', 'Retreat', 'Open Mic',
    'Award Show', 'Brand Activation', 'Corporate Event', 'Private Party',
    'Fundraiser', 'Networking Event', 'Party'
  ];

  // Candlelit Velvet accents, chosen for contrast on the button's dark
  // (--ink) pill: gold and parchment read clean against near-black, brass
  // is the mid warm tone between them. (The old amber/terracotta set was
  // picked for a light paper pill and would wash out now that the pill
  // itself is dark — see morph-slider.css.)
  var COLORS = ['#e0b26a', '#efe6d8', '#c98a45'];

  // Pin the word slot to the widest word's rendered width (same brand font
  // for every word) so "Book Mal to Host Your" never shifts as the last
  // word cycles, and redone on resize/font-load since the button's
  // font-size changes at breakpoints.
  var measurer = wordEl.cloneNode(false);
  measurer.style.position = 'absolute';
  measurer.style.visibility = 'hidden';
  measurer.style.whiteSpace = 'nowrap';
  measurer.style.width = 'auto';
  wordEl.parentNode.appendChild(measurer);

  function pinWordWidth() {
    var max = 0;
    WORDS.forEach(function (w) {
      measurer.textContent = w;
      max = Math.max(max, measurer.getBoundingClientRect().width);
    });
    wordEl.style.width = Math.ceil(max) + 'px';
  }

  pinWordWidth();
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(pinWordWidth);
  }
  window.addEventListener('resize', pinWordWidth);

  // Ported from React Bits' <FoldText/> (splitBy="char", hinge="top") to
  // vanilla JS + the GSAP already loaded on this page: each character gets
  // its own hinge-fold panel that rotates in from -92deg with a crease
  // shade, staggered per letter. Re-run on every word swap instead of once
  // on mount/scroll, since here the trigger is "the word just changed".
  var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function foldIn(text, color) {
    wordEl.style.setProperty('--word-color', color);
    wordEl.innerHTML = '';
    var pieces = [];
    Array.prototype.forEach.call(text, function (ch) {
      var seg = document.createElement('span');
      seg.className = 'fold-seg';
      var piece = document.createElement('span');
      piece.className = 'fold-piece';
      piece.textContent = ch === ' ' ? ' ' : ch;
      seg.appendChild(piece);
      wordEl.appendChild(seg);
      pieces.push(piece);
    });

    if (reduceMotion || typeof gsap === 'undefined') {
      pieces.forEach(function (p) { p.style.opacity = 1; });
      return;
    }

    gsap.fromTo(pieces,
      { opacity: 0, rotateX: -92, transformOrigin: '50% 0%', '--fold-crease': 0.55 },
      { opacity: 1, rotateX: 0, '--fold-crease': 0, duration: 0.55, ease: 'power3.out', stagger: 0.035 }
    );
  }

  var wordIndex = 0;
  foldIn(WORDS[0], COLORS[0]);
  setInterval(function () {
    wordIndex = (wordIndex + 1) % WORDS.length;
    foldIn(WORDS[wordIndex], COLORS[wordIndex % COLORS.length]);
  }, 1000);
})();
</script>
</body>
</html>
