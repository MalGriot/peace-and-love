<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hosting — Mal Griot</title>
<meta name="description" content="MC and hosting work for events, brand activations and shows by Mal Griot.">

<link rel="stylesheet" href="morph-slider.css?v=4">
</head>
<body>

<div id="chrome-nav"></div>

<section
  id="hosting-slider"
  class="morph-slider"
  data-videos="video/hosting-reel/dsc-9634-desktop.mp4,video/hosting-reel/sofar-6.mp4,video/hosting-reel/deep-dawn.mp4,"
  data-videos-mobile="video/hosting-reel/dsc-9634-mobile.mp4"
  data-posters="video/hosting-reel/dsc-9634-desktop-poster.jpg,video/hosting-reel/sofar-6-poster.jpg,video/hosting-reel/deep-dawn-poster.jpg,video/hosting-reel/dsc-9634-outro.jpg"
  data-posters-mobile="video/hosting-reel/dsc-9634-mobile-poster.jpg"
  data-object-positions="23% 42%,40% 35%,58% 42%,51% 40%"
  data-object-positions-mobile="44% 40%"
  data-position-keyframes="0:23% 42%,10:47% 42%,20:37% 42%,30:27% 37%,40:68% 53%,50:55% 42%,60:50% 42%|||"
  data-transition="melt"
  data-duration="1.1"
  data-intensity="0.55"
  data-scale="2.4"
  data-aberration="0.35"
  data-drift="0.4"
  data-loop="true"
  data-overlay-color="#000000"
>
  <div class="morph-slider-stage" tabindex="0" role="group" aria-roledescription="carousel" aria-label="Hosting reel"></div>
  <div class="morph-slider-videos"></div>

  <div class="morph-slider-controls">
    <button type="button" class="morph-slider-btn" data-action="prev" aria-label="Previous clip">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
        <path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <button type="button" class="morph-slider-btn" data-action="next" aria-label="Next clip">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
        <path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </div>

  <div class="morph-slider-indicators" role="tablist" aria-label="Clips"></div>

  <button type="button" class="morph-slider-unmute">Unmute</button>
</section>

<div id="chrome-chat"></div>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
