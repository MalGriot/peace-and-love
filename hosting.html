<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hosting — Mal Griot</title>
<meta name="description" content="MC and hosting work for events, brand activations and shows by Mal Griot.">
<link rel="icon" href="img/brand/favicon.ico">
<link rel="apple-touch-icon" href="img/brand/apple-touch-icon.png">
<link rel="stylesheet" href="shared.css">
<link rel="stylesheet" href="morph-slider.css?v=4">
<!-- Extra display faces used only by the cycling word in the booking CTA
     (see morph-slider.css / the script below) — each event type gets a
     typeface that fits its character (signature script for weddings, bold
     condensed for concerts, etc). Scoped to this page; the brand kit's
     Philosopher/Inter pairing is untouched everywhere else. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Caveat:wght@700&family=Anton&family=Bebas+Neue&family=Poppins:wght@500;600;700&family=Playfair+Display:ital,wght@1,500;1,600;1,700&family=Cormorant+Garamond:ital,wght@500&display=swap">
</head>
<body>

<div id="chrome-nav"></div>

<section
  id="hosting-slider"
  class="morph-slider"
  data-videos="video/hosting-reel/dsc-9634-desktop.mp4,video/hosting-reel/sofar-6.mp4,video/hosting-reel/deep-dawn.mp4,"
  data-videos-mobile="video/hosting-reel/dsc-9634-mobile.mp4"
  data-posters="video/hosting-reel/dsc-9634-desktop-poster.jpg,video/hosting-reel/sofar-6-poster.jpg,video/hosting-reel/deep-dawn-poster.jpg,video/hosting-reel/dsc-9634-outro.jpg"
  data-posters-mobile="video/hosting-reel/dsc-9634-mobile-poster.jpg"
  data-object-positions="23% 42%,40% 35%,58% 42%,51% 40%"
  data-object-positions-mobile="44% 40%"
  data-position-keyframes="0:23% 42%,10:47% 42%,20:37% 42%,30:27% 37%,40:68% 53%,50:55% 42%,60:50% 42%|||"
  data-transition="melt"
  data-duration="1.1"
  data-intensity="0.55"
  data-scale="2.4"
  data-aberration="0.35"
  data-drift="0.4"
  data-loop="true"
  data-overlay-color="#000000"
>
  <div class="morph-slider-stage" tabindex="0" role="group" aria-roledescription="carousel" aria-label="Hosting reel"></div>
  <div class="morph-slider-videos"></div>

  <div class="morph-slider-controls">
    <button type="button" class="morph-slider-btn" data-action="prev" aria-label="Previous clip">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
        <path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <button type="button" class="morph-slider-btn" data-action="next" aria-label="Next clip">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
        <path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </div>

  <div class="morph-slider-scrim"></div>

  <div class="morph-slider-cta">
    <h2 id="hosting-cta-headline">Need a host who can actually perform?</h2>
    <p>MC, performer, poet, storyteller, and crowd facilitator — bringing presence, personality, and energy to your event.</p>
    <a href="contact.html" class="btn btn-light">Book Mal to Host Your <span class="morph-slider-cta__word" id="hosting-cta-word">Event</span></a>
  </div>

  <div class="morph-slider-indicators" role="tablist" aria-label="Clips"></div>

  <button type="button" class="morph-slider-unmute">Unmute</button>
</section>

<div id="chrome-chat"></div>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script src="vendor/ogl.js"></script>
<script src="morph-slider.js?v=7"></script>
<script src="shared.js"></script>
<script src="chat.js"></script>
<script>renderChrome('hosting');</script>
<script>
// CTA copy: headline tracks the reel's current slide (see morph-slider.js's
// 'slide-change' event); the button's last word cycles independently on a
// fixed 1s timer so it keeps moving even while the reel sits still.
(function () {
  var slider = document.getElementById('hosting-slider');
  var headline = document.getElementById('hosting-cta-headline');
  var wordEl = document.getElementById('hosting-cta-word');
  if (!slider || !headline || !wordEl) return;

  var HEADLINES = [
    'Need a host who can actually perform?',
    'Hire a host who can bring everyone together',
    'Ready to hand over the mic?',
    'Go with a host that does the most'
  ];

  slider.addEventListener('slide-change', function (e) {
    headline.textContent = HEADLINES[Math.min(e.detail.index, HEADLINES.length - 1)];
  });

  // Each word carries its own typeface/weight/tracking/case, tuned to the
  // character of that event — a signature script for weddings, bold
  // condensed poster type for concerts/festivals, glam italic serif for
  // galas/award shows, clean geometric sans for corporate/professional
  // bookings, calm italic serif for retreats, marker script for open
  // mics/parties. sizeEm scales script/handwritten faces up (they read
  // smaller than a bold sans at the same font-size) so every word reads
  // with roughly the same visual weight despite the very different faces.
  var WORDS = [
    { text: 'Event',              font: "'Inter', sans-serif",             weight: 600, style: 'normal', caps: true,  tracking: '0.12em', sizeEm: 1 },
    { text: 'Weddings',           font: "'Great Vibes', cursive",          weight: 400, style: 'normal', caps: false, tracking: '0.01em', sizeEm: 1.65 },
    { text: 'Festivals',          font: "'Anton', sans-serif",             weight: 400, style: 'normal', caps: true,  tracking: '0.02em', sizeEm: 1.05 },
    { text: 'Concerts',           font: "'Bebas Neue', sans-serif",        weight: 400, style: 'normal', caps: true,  tracking: '0.05em', sizeEm: 1.15 },
    { text: 'Conferences',        font: "'Poppins', sans-serif",           weight: 600, style: 'normal', caps: true,  tracking: '0.08em', sizeEm: 1 },
    { text: 'Galas',               font: "'Playfair Display', serif",      weight: 600, style: 'italic', caps: false, tracking: '0.01em', sizeEm: 1.15 },
    { text: 'Launches',           font: "'Poppins', sans-serif",           weight: 700, style: 'normal', caps: true,  tracking: '0.1em',  sizeEm: 1 },
    { text: 'Summits',            font: "'Poppins', sans-serif",           weight: 700, style: 'normal', caps: true,  tracking: '0.14em', sizeEm: 1 },
    { text: 'Panels',             font: "'Poppins', sans-serif",           weight: 500, style: 'normal', caps: true,  tracking: '0.06em', sizeEm: 1 },
    { text: 'Workshops',          font: "'Poppins', sans-serif",           weight: 500, style: 'normal', caps: true,  tracking: '0.04em', sizeEm: 1 },
    { text: 'Retreats',           font: "'Cormorant Garamond', serif",     weight: 500, style: 'italic', caps: false, tracking: '0.02em', sizeEm: 1.2 },
    { text: 'Open Mics',          font: "'Caveat', cursive",               weight: 700, style: 'normal', caps: false, tracking: '0.01em', sizeEm: 1.5 },
    { text: 'Award Shows',        font: "'Playfair Display', serif",       weight: 700, style: 'italic', caps: false, tracking: '0.01em', sizeEm: 1.15 },
    { text: 'Brand Activations',  font: "'Poppins', sans-serif",           weight: 700, style: 'normal', caps: true,  tracking: '0.05em', sizeEm: 0.95 },
    { text: 'Corporate Events',   font: "'Poppins', sans-serif",           weight: 600, style: 'normal', caps: true,  tracking: '0.06em', sizeEm: 0.95 },
    { text: 'Private Parties',    font: "'Great Vibes', cursive",          weight: 400, style: 'normal', caps: false, tracking: '0.01em', sizeEm: 1.45 },
    { text: 'Fundraisers',        font: "'Playfair Display', serif",       weight: 500, style: 'italic', caps: false, tracking: '0.01em', sizeEm: 1.1 },
    { text: 'Networking Events',  font: "'Poppins', sans-serif",           weight: 600, style: 'normal', caps: true,  tracking: '0.05em', sizeEm: 0.95 },
    { text: 'Party',              font: "'Caveat', cursive",               weight: 700, style: 'normal', caps: false, tracking: '0.01em', sizeEm: 1.55 }
  ];

  function applyWordStyle(el, w) {
    el.textContent = w.text;
    el.style.fontFamily = w.font;
    el.style.fontWeight = w.weight;
    el.style.fontStyle = w.style;
    el.style.textTransform = w.caps ? 'uppercase' : 'none';
    el.style.letterSpacing = w.tracking;
    el.style.fontSize = w.sizeEm + 'em';
  }

  // Pin the word slot to the widest word's rendered width (each measured in
  // its own font/weight/size) so "Book Mal to Host Your" never shifts as
  // the last word cycles through very different typefaces — measured off a
  // hidden clone rather than guessed, and redone on resize/font-load since
  // the button's base font-size changes at mobile breakpoints.
  var measurer = wordEl.cloneNode(false);
  measurer.style.position = 'absolute';
  measurer.style.visibility = 'hidden';
  measurer.style.whiteSpace = 'nowrap';
  measurer.style.width = 'auto';
  wordEl.parentNode.appendChild(measurer);

  function pinWordWidth() {
    var max = 0;
    WORDS.forEach(function (w) {
      applyWordStyle(measurer, w);
      max = Math.max(max, measurer.getBoundingClientRect().width);
    });
    wordEl.style.width = Math.ceil(max) + 'px';
  }

  applyWordStyle(wordEl, WORDS[0]);
  pinWordWidth();
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(pinWordWidth);
  }
  window.addEventListener('resize', pinWordWidth);

  var wordIndex = 0;
  setInterval(function () {
    wordIndex = (wordIndex + 1) % WORDS.length;
    wordEl.style.opacity = 0;
    setTimeout(function () {
      applyWordStyle(wordEl, WORDS[wordIndex]);
      wordEl.style.opacity = 1;
    }, 150);
  }, 1000);
})();
</script>
</body>
</html>
