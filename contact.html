<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact — Mal Griot</title>
<link rel="icon" href="img/brand/favicon.ico">
<link rel="apple-touch-icon" href="img/brand/apple-touch-icon.png">
<link rel="stylesheet" href="shared.css">
<style>
  body{background:var(--ink)}
  .c-hero{min-height:100vh;min-height:100dvh;display:flex;align-items:center;padding:120px clamp(20px,5vw,64px) 80px}
  .c-grid{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:60px;max-width:1200px;margin:0 auto}
  .c-eyebrow{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--brass);margin-bottom:16px}
  .c-title{font-family:var(--font-display);font-weight:400;font-size:clamp(40px,6vw,72px);margin:0 0 20px}
  .c-desc{font-size:15.5px;line-height:1.7;color:var(--paper-dim);max-width:42ch;margin-bottom:36px}
  .c-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:18px}
  .c-list a{text-decoration:none;color:var(--paper);font-size:15px;display:flex;align-items:center;gap:12px}
  .c-list a:hover{color:var(--brass)}
  .c-list .k{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--paper-faint);width:90px;flex:none}

  .c-form{background:#1c1815;border:1px solid rgba(239,230,216,.1);border-radius:16px;padding:36px}
  .c-form h2{font-family:var(--font-display);font-weight:400;font-size:22px;margin:0 0 24px}
  .field{margin-bottom:18px}
  .field label{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--paper-dim);margin-bottom:8px}
  .field input,.field select,.field textarea{
    width:100%;background:rgba(239,230,216,.05);border:1px solid rgba(239,230,216,.15);border-radius:8px;
    padding:12px 14px;color:var(--paper);font-family:var(--font-body);font-size:14px;
  }
  .field textarea{resize:vertical;min-height:100px}
  .field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--brass)}
  .c-form button{width:100%;justify-content:center;margin-top:8px}
  @media (max-width:820px){.c-grid{grid-template-columns:1fr}}
</style>
</head>
<body>

<div id="chrome-nav"></div>

<section class="c-hero">
  <div class="c-grid">
    <div>
      <span class="c-eyebrow">Get in Touch</span>
      <h1 class="c-title">Let's talk.</h1>
      <p class="c-desc">Booking a show, commissioning a cut, or setting up a session — reach out and it goes straight to Mal.</p>
      <ul class="c-list">
        <li><a href="mailto:hello@malgriot.com"><span class="k">Email</span> hello@malgriot.com</a></li>
        <li><a href="https://instagram.com/yep.that.malcolm" target="_blank" rel="noopener"><span class="k">Instagram</span> @yep.that.malcolm</a></li>
        <li><a href="https://open.spotify.com/artist/61bgVlMQw2S0t6d8mVPVIS" target="_blank" rel="noopener"><span class="k">Spotify</span> Mal Griot</a></li>
      </ul>
    </div>

    <form class="c-form" onsubmit="event.preventDefault()">
      <h2>Send a message</h2>
      <div class="field">
        <label for="name">Name</label>
        <input id="name" type="text" placeholder="Your name">
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" placeholder="you@example.com">
      </div>
      <div class="field">
        <label for="topic">What's this about?</label>
        <select id="topic">
          <option>Music / Booking</option>
          <option>Griot Cuts / Editing</option>
          <option>Wellness + Coaching</option>
          <option>Something else</option>
        </select>
      </div>
      <div class="field">
        <label for="message">Message</label>
        <textarea id="message" placeholder="Tell me a bit about what you need"></textarea>
      </div>
      <button type="submit" class="btn btn-light">Send Message</button>
    </form>
  </div>
</section>

<div id="chrome-footer"></div>
<div id="chrome-chat"></div>
<div id="chrome-player"></div>

<script src="shared.js"></script>
<script>renderChrome('contact');</script>
</body>
</html>
