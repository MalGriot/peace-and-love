<style>
  html,body{height:100%;overflow:hidden}
  .home{position:relative;width:100vw;height:100vh;height:100dvh;display:flex;overflow:hidden}

  .home-mark{
    position:absolute;top:clamp(18px,3vh,32px);left:50%;transform:translateX(-50%);
    z-index:20;display:flex;flex-direction:column;align-items:center;gap:2px;pointer-events:auto;
    cursor:default;transition:transform .4s ease;
  }
  .home-mark:hover{transform:translateX(-50%) scale(1.12)}
  .home-mark__row{display:flex;align-items:center;gap:8px}
  .home-mark__icon{width:22px;height:22px;filter:drop-shadow(0 2px 10px rgba(0,0,0,.5))}
  .home-mark:hover .home-mark__icon{animation:record-spin 1.6s linear infinite}
  @keyframes record-spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
  .home-mark__name{font-family:var(--font-display);font-size:clamp(16px,2vw,20px);letter-spacing:.16em;text-transform:uppercase;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.9),0 2px 10px rgba(0,0,0,.8),0 6px 22px rgba(0,0,0,.6)}
  .home-mark::before{
    content:'';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:calc(100% + 36px);height:calc(100% + 20px);
    background:radial-gradient(ellipse at center, rgba(0,0,0,.42) 0%, rgba(0,0,0,0) 72%);
    z-index:-1;pointer-events:none;
  }

  .home-bar{
    position:absolute;z-index:20;bottom:clamp(20px,4vh,40px);left:50%;transform:translateX(-50%);
    display:flex;align-items:center;gap:clamp(18px,2.6vw,30px);
  }
  .home-bar a{
    position:relative;display:flex;align-items:center;justify-content:center;
    color:var(--gold);text-decoration:none;
    filter:drop-shadow(0 2px 8px rgba(0,0,0,.6));
    transition:color .2s ease,transform .3s cubic-bezier(.34,1.56,.64,1);
  }
  .home-bar a svg{width:19px;height:19px;display:block}
  .home-bar a:hover{color:#f4d59a;transform:translateY(-4px) scale(1.14)}
  .home-bar a.home-bar__contact{
    font-family:var(--font-body);font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  }
  .home-bar__contact-icon{display:none}
  .home-bar a[data-tip]::after{
    content:attr(data-tip);position:absolute;bottom:calc(100% + 14px);left:50%;transform:translateX(-50%) translateY(4px);
    white-space:nowrap;background:#0b0a09;color:var(--gold);font-size:11px;letter-spacing:.08em;text-transform:uppercase;
    padding:7px 13px;border-radius:3px;border:1px solid rgba(224,178,106,.35);
    opacity:0;pointer-events:none;transition:opacity .25s ease,transform .25s ease;
    font-family:var(--font-body);
  }
  .home-bar a[data-tip]::before{
    content:'';position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);
    border:5px solid transparent;border-top-color:#0b0a09;
    opacity:0;pointer-events:none;transition:opacity .25s ease;
  }
  .home-bar a[data-tip]:hover::after{opacity:1;transform:translateX(-50%) translateY(0)}
  .home-bar a[data-tip]:hover::before{opacity:1}

  .accordion{
    position:absolute;inset:0;display:flex;overflow-x:auto;overflow-y:hidden;
    scrollbar-width:none;-ms-overflow-style:none;-webkit-overflow-scrolling:touch;
  }
  .accordion::-webkit-scrollbar{display:none}
  .acc-item{
    position:relative;flex:0 0 20vw;width:20vw;height:100%;overflow:hidden;display:block;
    text-decoration:none;cursor:pointer;
    transition:flex .6s cubic-bezier(.22,.9,.3,1);
  }
  .accordion.has-active .acc-item.is-active{flex:0 0 40vw}

  .acc-item__photo{
    position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
    filter:grayscale(1) brightness(.55);
    transition:filter .5s ease,opacity .5s ease,transform 8s ease;
  }
  .acc-item.is-active .acc-item__photo{filter:grayscale(0) brightness(1)}
  .acc-item.is-playing .acc-item__photo{opacity:0}
  .acc-item:hover .acc-item__photo{transform:scale(1.04)}

  .acc-item[data-key="hosting"] .acc-item__photo{transform:scale(1.12) translateY(-5%)}
  .acc-item[data-key="hosting"]:hover .acc-item__photo{transform:scale(1.16) translateY(-5%)}
  .acc-item[data-key="soundbaths"]:hover .acc-item__photo{transform:scale(1.75)}
  .acc-item[data-key="soundscapes"] .acc-item__photo{transform:scale(1.18) translateY(-9%)}
  .acc-item[data-key="soundscapes"]:hover .acc-item__photo{transform:scale(1.5);transform-origin:50% 28% !important}
  .acc-item[data-key="poetry"] .acc-item__photo{transform:scale(1.3)}
  .acc-item[data-key="poetry"]:hover .acc-item__photo{transform:scale(1.36)}
  .acc-item[data-key="acting"] .acc-item__photo{transform:scale(1.28)}
  .acc-item[data-key="acting"]:hover .acc-item__photo{transform:scale(1.34)}
  .acc-item[data-key="voiceover"] .acc-item__photo{transform:scale(1.4)}
  .acc-item[data-key="voiceover"]:hover .acc-item__photo{transform:scale(1.46)}

  /* on-hover zoom focal points */
  .acc-item[data-key="discography"]:hover .acc-item__photo{object-position:44% 15% !important;transform-origin:44% 15% !important}
  .acc-item[data-key="performance"]:hover .acc-item__photo{object-position:51% 15% !important;transform-origin:51% 15% !important}
  .acc-item[data-key="hosting"]:hover .acc-item__photo{transform-origin:72.1% 17% !important}
  .acc-item[data-key="poetry"]:hover .acc-item__photo{transform-origin:50% 18% !important}
  .acc-item[data-key="acting"]:hover .acc-item__photo{transform-origin:57% 19% !important}
  .acc-item[data-key="voiceover"]:hover .acc-item__photo{transform-origin:41% 47% !important}
  .acc-item[data-key="soundbaths"]:hover .acc-item__photo{transform-origin:44% 39% !important}
  .acc-item[data-key="meditation"]:hover .acc-item__photo{transform-origin:50% 13% !important}
  .acc-item[data-key="about"]:hover .acc-item__photo{transform-origin:41% 23% !important}

  .acc-item__video{
    position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
    opacity:0;transition:opacity .6s ease;
  }
  .acc-item.is-playing .acc-item__video{opacity:1}

  .acc-item__indicator{position:relative;width:32px;height:32px;flex:none;display:none}
  .accordion.has-active .acc-item.is-active .acc-item__indicator{display:inline-flex}

  .acc-item__mute{
    position:absolute;inset:0;
    width:32px;height:32px;flex:none;border-radius:50%;border:1px solid rgba(255,255,255,.35);
    background:rgba(8,7,6,.55);backdrop-filter:blur(4px);
    display:none;align-items:center;justify-content:center;cursor:pointer;
    opacity:0;transition:opacity .3s ease,background .2s ease,transform .2s ease;
  }
  .acc-item__mute svg{width:15px;height:15px;fill:#fff}
  .accordion.has-active .acc-item.is-active.is-playing .acc-item__mute{display:flex;opacity:1}
  .acc-item__mute:hover{background:rgba(8,7,6,.85);transform:scale(1.08)}

  .acc-item__timer{
    position:absolute;inset:0;border-radius:50%;
    background:rgba(8,7,6,.55);backdrop-filter:blur(4px);
    display:flex;align-items:center;justify-content:center;
    opacity:0;pointer-events:none;transition:opacity .25s ease;
  }
  .acc-item.is-active:not(.is-playing) .acc-item__timer{opacity:1}
  .acc-item__timer svg{width:100%;height:100%;transform:rotate(-90deg)}
  .acc-item__timer circle{fill:none;stroke-width:2}
  .acc-item__timer .timer-track{stroke:rgba(255,255,255,.3)}
  .acc-item__timer .timer-progress{
    stroke:#f4d59a;stroke-linecap:round;
    stroke-dasharray:81.68;stroke-dashoffset:81.68;
  }

  .acc-item__scrim{position:absolute;inset:0;background:linear-gradient(to top, rgba(8,7,6,.92) 0%, rgba(8,7,6,.5) 34%, rgba(8,7,6,.12) 62%);z-index:2}

  .acc-item__title{
    position:absolute;z-index:3;left:0;right:0;bottom:clamp(84px,13vh,118px);
    font-family:var(--font-display);font-weight:500;color:#fff;line-height:1.05;
    text-shadow:0 1px 4px rgba(0,0,0,.95),0 4px 16px rgba(0,0,0,.75),0 10px 34px rgba(0,0,0,.5);
    writing-mode:vertical-rl;text-orientation:mixed;transform:rotate(180deg);
    padding:0 0 0 clamp(10px,1.4vw,18px);font-size:clamp(15px,1.6vw,20px);letter-spacing:.04em;
    white-space:nowrap;transition:writing-mode 0s .1s;
  }
  .accordion.has-active .acc-item.is-active .acc-item__title{
    writing-mode:horizontal-tb;transform:none;padding:0 clamp(18px,3vw,44px);
    font-size:clamp(22px,3.4vw,44px);transition:none;
    display:flex;align-items:center;gap:16px;
  }
  .acc-item__soon{
    position:absolute;z-index:3;left:clamp(18px,3vw,44px);bottom:clamp(48px,8vh,72px);
    font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.75);
    text-shadow:0 1px 3px rgba(0,0,0,.9);opacity:0;transition:opacity .3s ease .15s;
  }
  .accordion.has-active .acc-item.is-active .acc-item__soon{opacity:1}

  /* stack vertically on narrow screens; tap expands height instead of width */
  @media (max-width:900px){
    .accordion{flex-direction:column;overflow-x:hidden;overflow-y:auto}
    .acc-item{flex:0 0 33.34vh !important;width:100% !important;height:33.34vh}
    .accordion.has-active .acc-item.is-active{flex:0 0 50vh !important}
    .acc-item__title{
      writing-mode:horizontal-tb;transform:none;
      left:18px;right:18px;bottom:14px;font-size:16px;padding:0;
      display:flex;align-items:center;gap:12px;
    }
    .accordion.has-active .acc-item.is-active .acc-item__title{font-size:26px;padding:0;gap:12px}
    .acc-item__indicator{width:26px;height:26px}
    .acc-item__mute{width:26px;height:26px}
    .acc-item__mute svg{width:13px;height:13px}
    .acc-item__soon{left:18px;bottom:44px}
    .home-mark{top:22px}
    .home-bar{
      top:auto;left:auto;transform:none;
      right:clamp(16px,3vw,32px);
      bottom:calc(clamp(16px,3vw,32px) + 56px + 14px);
      flex-direction:column;flex-wrap:nowrap;
      align-items:center;justify-content:flex-end;
      gap:10px;width:56px;
    }
    .home-bar a{
      width:44px;height:44px;flex:none;
      background:rgba(8,7,6,.55);border-radius:999px;
      border:1px solid rgba(224,178,106,.22);backdrop-filter:blur(6px);
    }
    .home-bar a svg{width:19px;height:19px}
    .home-bar a[data-tip]::after,.home-bar a[data-tip]::before{display:none}
    .home-bar a.home-bar__contact{font-size:0}
    .home-bar__contact-icon{display:block}
    .home-bar__contact-text{display:none}

    .acc-item[data-key="discography"] .acc-item__photo{object-position:44% 0% !important}
    .acc-item[data-key="performance"] .acc-item__photo{object-position:51% 8% !important}
    .acc-item[data-key="hosting"] .acc-item__photo{object-position:55% 4% !important}
    .acc-item[data-key="poetry"] .acc-item__photo{object-position:50% 26% !important}
    .acc-item[data-key="acting"] .acc-item__photo{object-position:45% 20% !important}
    .acc-item[data-key="voiceover"] .acc-item__photo{object-position:49% 36% !important}
    .acc-item[data-key="soundbaths"] .acc-item__photo{object-position:44% 11% !important}
    .acc-item[data-key="meditation"] .acc-item__photo{object-position:50% 0% !important}
    .acc-item[data-key="soundscapes"] .acc-item__photo{object-position:65% 19% !important}
    .acc-item[data-key="about"] .acc-item__photo{object-position:41% 0% !important}
  }
</style>

<script>
  document.getElementById('chrome-chat').outerHTML = chatWidgetHtml();

  const accordion = document.getElementById('accordion');
  const items = document.querySelectorAll('.acc-item');
  accordion.classList.add('has-active');

  const ICON_UNMUTED = '<path d="M4 9v6h4l5 5V4L8 9H4z"/><path d="M15.5 8.5a4 4 0 010 7"/><path d="M18 6a7.5 7.5 0 010 12" style="fill:none;stroke:#fff;stroke-width:1.6;stroke-linecap:round"/>';
  const ICON_MUTED = '<path d="M4 9v6h4l5 5V4L8 9H4z"/><path d="M15.5 9.5l5 5M20.5 9.5l-5 5" style="fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round"/>';

  const VIDEO_DELAY = 5000;
  const TIMER_CIRCUMFERENCE = 81.68; // 2 * PI * r(13)

  items.forEach((item) => {
    const video = item.querySelector('.acc-item__video');
    const muteBtn = item.querySelector('.acc-item__mute');
    const muteIcon = muteBtn.querySelector('svg');
    const timerProgress = item.querySelector('.timer-progress');
    let playTimer = null;
    let ringFrame = null;

    const renderMuteIcon = () => {
      muteIcon.innerHTML = video.muted ? ICON_MUTED : ICON_UNMUTED;
      muteBtn.setAttribute('aria-label', video.muted ? 'Unmute video' : 'Mute video');
    };
    renderMuteIcon();

    const resetTimerRing = () => {
      if (!timerProgress) return;
      cancelAnimationFrame(ringFrame);
      timerProgress.style.strokeDashoffset = TIMER_CIRCUMFERENCE;
    };
    resetTimerRing();

    const runTimerRing = () => {
      if (!timerProgress) return;
      const start = performance.now();
      const step = (now) => {
        const progress = Math.min(1, (now - start) / VIDEO_DELAY);
        timerProgress.style.strokeDashoffset = String(TIMER_CIRCUMFERENCE * (1 - progress));
        if (progress < 1) ringFrame = requestAnimationFrame(step);
      };
      cancelAnimationFrame(ringFrame);
      ringFrame = requestAnimationFrame(step);
    };

    item.addEventListener('mouseenter', () => {
      items.forEach((i) => i.classList.remove('is-active', 'is-playing'));
      item.classList.add('is-active');

      clearTimeout(playTimer);
      resetTimerRing();
      runTimerRing();

      playTimer = setTimeout(() => {
        item.classList.add('is-playing');
        video.currentTime = 0;
        video.play().catch(() => {});
      }, VIDEO_DELAY);
    });

    item.addEventListener('mouseleave', () => {
      item.classList.remove('is-active', 'is-playing');
      clearTimeout(playTimer);
      video.pause();
      resetTimerRing();
    });

    muteBtn.addEventListener('click', (e) => {
      e.preventDefault();
      e.stopPropagation();
      video.muted = !video.muted;
      if (!video.muted) {
        video.volume = 1;
        video.play().catch(() => {});
      }
      renderMuteIcon();
    });

    item.addEventListener('click', (e) => {
      if (item.getAttribute('href') === '#') e.preventDefault();
    });
  });

  // Idle auto-scroll: slowly ping-pong the strip end-to-end while nothing is hovered
  const AUTO_SCROLL_SPEED = 26; // px/sec
  const AUTO_SCROLL_END_PAUSE = 5000; // ms to rest at each end
  const stackedQuery = window.matchMedia('(max-width:900px)');
  let autoScrollDir = 1;
  let autoScrollPaused = false;
  let autoScrollLastTs = null;
  let autoScrollEndPauseUntil = 0;

  const stepAutoScroll = (ts) => {
    if (autoScrollLastTs == null) autoScrollLastTs = ts;
    const dt = (ts - autoScrollLastTs) / 1000;
    autoScrollLastTs = ts;

    if (!autoScrollPaused && ts >= autoScrollEndPauseUntil) {
      const vertical = stackedQuery.matches;
      const max = vertical
        ? accordion.scrollHeight - accordion.clientHeight
        : accordion.scrollWidth - accordion.clientWidth;
      if (max > 0) {
        const current = vertical ? accordion.scrollTop : accordion.scrollLeft;
        let next = current + AUTO_SCROLL_SPEED * autoScrollDir * dt;
        if (next >= max) { next = max; autoScrollDir = -1; autoScrollEndPauseUntil = ts + AUTO_SCROLL_END_PAUSE; }
        else if (next <= 0) { next = 0; autoScrollDir = 1; autoScrollEndPauseUntil = ts + AUTO_SCROLL_END_PAUSE; }
        if (vertical) accordion.scrollTop = next;
        else accordion.scrollLeft = next;
      }
    }
    requestAnimationFrame(stepAutoScroll);
  };
  requestAnimationFrame(stepAutoScroll);

  accordion.addEventListener('mouseenter', () => { autoScrollPaused = true; });
  accordion.addEventListener('mouseleave', () => { autoScrollPaused = false; autoScrollLastTs = null; });
  accordion.addEventListener('touchstart', () => { autoScrollPaused = true; }, { passive: true });
  accordion.addEventListener('touchend', () => { autoScrollPaused = false; autoScrollLastTs = null; });
</script>
